name: Release APK

# Push a tag like v1.0.0 to build the app and publish the APK as a GitHub
# Release. You can also run it by hand from the Actions tab: that builds the
# APK and attaches it to the run as a downloadable artifact (no Release).
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write # needed to create the Release

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-apk:
    name: Build and publish APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Run tests
        run: flutter test

      - name: Set up release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
            {
              echo "storeFile=upload-keystore.jks"
              echo "storePassword=$KEYSTORE_PASSWORD"
              echo "keyAlias=$KEY_ALIAS"
              echo "keyPassword=$KEY_PASSWORD"
            } > android/key.properties
            echo "Signing the APK with your release keystore."
          else
            echo "::warning title=APK signed with a temporary debug key::No ANDROID_KEYSTORE_BASE64 secret found. This APK installs fine, but every release gets a different signature, so it cannot update over a previous release. See the README (Releases) to add a keystore."
          fi

      - name: Work out the version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
            echo "name=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
            echo "file=nike-shop-$GITHUB_REF_NAME.apk" >> "$GITHUB_OUTPUT"
          else
            echo "tag=" >> "$GITHUB_OUTPUT"
            echo "name=" >> "$GITHUB_OUTPUT"
            echo "file=nike-shop-${GITHUB_SHA::7}.apk" >> "$GITHUB_OUTPUT"
          fi

      - name: Build release APK
        env:
          VERSION_NAME: ${{ steps.version.outputs.name }}
        run: |
          # On a tag, the app's version comes from the tag (v1.2.0 -> 1.2.0) and
          # the build number from the run number so each release is newer.
          if [ -n "$VERSION_NAME" ]; then
            flutter build apk --release \
              --build-name="$VERSION_NAME" \
              --build-number="$GITHUB_RUN_NUMBER"
          else
            flutter build apk --release
          fi

      - name: Name the APK and write its checksum
        id: apk
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk "dist/${{ steps.version.outputs.file }}"
          (cd dist && sha256sum "${{ steps.version.outputs.file }}" > "${{ steps.version.outputs.file }}.sha256")
          ls -la dist

      - name: Upload APK as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.version.outputs.file }}
          path: dist/*
          retention-days: 14

      - name: Publish GitHub Release
        if: steps.version.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          FILES=(dist/*)
          if gh release view "$TAG" >/dev/null 2>&1; then
            # Re-run for an existing release: replace the attached files.
            gh release upload "$TAG" "${FILES[@]}" --clobber
          else
            gh release create "$TAG" "${FILES[@]}" \
              --verify-tag \
              --title "Nike Shop $TAG" \
              --generate-notes
          fi
